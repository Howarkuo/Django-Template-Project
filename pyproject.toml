[tool.poetry]
authors = ["Futurenest inc. RD Team, Boris initiative"]
description = "django template"
name = "django-template"
package-mode = false
readme = "README.md"
version = "1.0.0"

[tool.poetry.dependencies]
argon2-cffi = "^23.1.0"
boto3 = "^1.35.76"
celery = "^5.4.0"
crispy-bootstrap5 = "^2024.10"
cryptography = "^44.0.0"
datasets = "^3.1.0"
django = "^4.2.17"
django-allauth = "^65.3.0"
django-bitfield = "^2.2.0"
django-celery-beat = "^2.7.0"
django-celery-results = "2.3.1"
django-cors-headers = "^4.6.0"
django-crispy-forms = "^2.3"
django-debug-toolbar = "^4.4.6"
django-encrypted-model-fields = "^0.6.5"
django-extensions = "^3.2.3"
django-ninja-extra = "^0.21.8"
django-ninja-jwt = "^5.3.5"
django-otp = "^1.5.4"
django-pandas = "^0.6.7"
django-prometheus = "^2.3.1"
django-query-inspector = "^1.3.0"
djangorestframework = "^3.15.2"
djangorestframework-types = "^0.9.0"
email-validator = "^2.1.1"
feedparser = "^6.0.10"
flower = "^2.0.1"
httpx = "^0.28.0"
numexpr = "^2.10.0"
numpy = "^2.1.3"
opencc-python-reimplemented = "^0.1.7"
openpyxl = "^3.1.2"
pandas = "^2.2.3"
pillow = "^11.0.0"
psycopg2-binary = "^2.9.9"
pyarrow = "^18.1.0"
python = "3.12.*"
python-dotenv = "^1.0.0"
pytz = "^2024.2"
ragas = "^0.2.7"
reportlab = "^4.1.0"
rich = "^13.7.0"
sentry-sdk = {extras = ["django"], version = "^2.16.0"}
tiktoken = "^0.8.0"
uvicorn = "^0.32.1"

[tool.poetry.group.lint.dependencies]
pyright = "^1.1.333"
ruff = "^0.8.0"

[tool.poetry.group.dev.dependencies]
colorlog = "^6.8.0"
django-types = "^0.19.1"
pre-commit = "^4.0.1"
uv = "^0.5.2"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.ruff]
exclude = [
  ".venv",
  "_venv",
  "venv",
  ".git",
  ".vscode",
  "*/migrations/*",
]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
ignore = [
  # https://docs.astral.sh/ruff/rules/#rules
  "D100",
  "D104",
  "D105",
  "D106",
  "E501",
  "DJ001",
  "Q000",
  "TID252",
  "ERA",
  "EM102",
  "PGH003",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PT009",
  "ANN201",
  "ANN401",
  "TRY003",
  "EM101",
  "TD003",
  "A003",
  "RUF001",
  "RUF012",
  "FBT003",
  "PD901",
  "BLE001",
  "N818",
  "DTZ001",
  "W191",
  "DJ008",
  "COM812",
  "ISC001",
]
select = [
  # https://docs.astral.sh/ruff/rules/#rules
  "ALL",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
detect-same-package = true
force-single-line = true
known-first-party = [
  "core",
]
known-third-party = [
  "asgiref",
  "ninja_extra",
]
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "config",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = true

[tool.ruff.lint.isort.sections]
config = ["config"]

[tool.pyright]
extraPaths = ["./features"]
ignore = [".venv", "_venv", "venv", ".git", ".vscode", "*/migrations/*"]
include = ["./features"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
